<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudaIA - Assistente RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-chat: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-color: #0f172a;
            --accent-hover: #1e293b;
            --border-color: #e2e8f0;
            --user-msg-bg: #f8fafc;
            --bot-msg-bg: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            line-height: 1.6;
        }

        /* Top Navigation / Header */
        .header {
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            z-index: 50;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 svg {
            color: #4f46e5;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            align-items: center;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            scroll-behavior: smooth;
        }

        .chat-wrapper {
            max-width: 768px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 0.9375rem;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            line-height: 1.6;
            color: var(--text-primary);
        }

        .message.user {
            background-color: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 4px;
            padding-left: 0; /* Minimal bot style, no box */
            max-width: 100%;
        }

        /* Bot Identity Marker */
        .bot-identity {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .bot-avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Markdown Styles inside bot message */
        .message-content p { margin-bottom: 12px; }
        .message-content p:last-child { margin-bottom: 0; }
        
        .message-content strong { font-weight: 600; }
        
        .message-content h3 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 24px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        
        .message-content h3:nth-of-type(1) { margin-top: 0; color: #059669; }
        .message-content h3:nth-of-type(2) { color: #2563eb; }
        .message-content h3:nth-of-type(3) { color: #9333ea; }
        
        .message-content em {
            background-color: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            font-style: normal;
            font-size: 0.85rem;
            color: #64748b;
            border: 1px solid var(--border-color);
        }

        /* Input Area */
        .input-wrapper {
            width: 100%;
            padding: 24px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
            flex-shrink: 0;
        }

        .input-container {
            width: 100%;
            max-width: 768px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            box-shadow: var(--shadow-md);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-container:focus-within {
            border-color: #cbd5e1;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        textarea {
            flex: 1;
            padding: 4px 0;
            border: none;
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            resize: none;
            background: transparent;
            max-height: 200px;
            min-height: 24px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        button.send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-bottom: -2px;
        }

        button.send-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button.send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        button.send-btn:disabled {
            background-color: #f1f5f9;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding-left: 40px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-style: italic;
        }

        .typing-indicator span {
            display: inline-block;
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .chat-container { padding: 24px 16px; }
            .input-wrapper { padding: 16px; }
            .message { max-width: 92%; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            EstudaIA
        </h1>
    </header>

    <main class="main-content">
        <div class="chat-container" id="chat">
            <div class="chat-wrapper" id="chat-wrapper">
                <!-- Mensagem Inicial -->
                <div class="message-row bot">
                    <div class="message bot">
                        <div class="bot-identity">
                            <div class="bot-avatar">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                            Assistente Especializado
                        </div>
                        <div class="message-content">
                            <p><strong>Olá! Sou o seu tutor de estudos focado nos documentos e leis oficiais.</strong></p>
                            <p>Como posso te ajudar hoje? Envie uma questão de simulado ou uma dúvida sobre o material de estudo.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="chat-wrapper">
                <div class="typing-indicator" id="typing">
                    Consultando a base de documentos<span>.</span><span>.</span><span>.</span>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <form class="input-container" id="form">
                <textarea id="query" rows="1" placeholder="Pergunte qualquer coisa sobre o regulamento..." required></textarea>
                <button type="submit" class="send-btn" id="submitBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        const inputEl = document.getElementById('query');
        const form = document.getElementById('form');
        const chatWrapper = document.getElementById('chat-wrapper');
        const chatContainer = document.getElementById('chat');
        const submitBtn = document.getElementById('submitBtn');
        const typingIndicator = document.getElementById('typing');

        // Auto-resize textarea
        function adjustTextareaHeight() {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        }
        inputEl.addEventListener('input', adjustTextareaHeight);

        function addMessage(text, isUser = false) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${isUser ? 'user' : 'bot'}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            if (isUser) {
                // Preservar quebras de linha para usuário
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                // Template moderno para o bot com avatar
                msgDiv.innerHTML = `
                    <div class="bot-identity">
                        <div class="bot-avatar">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </div>
                        Assistente Especializado
                    </div>
                    <div class="message-content">
                        ${marked.parse(text)}
                    </div>
                `;
            }

            rowDiv.appendChild(msgDiv);
            chatWrapper.appendChild(rowDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(inputEl.value.trim() !== '') form.dispatchEvent(new Event('submit'));
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = inputEl.value.trim();
            if (!text) return;

            addMessage(text, true);
            inputEl.value = '';
            inputEl.style.height = 'auto';
            submitBtn.disabled = true;
            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                // O código fará uma requisição para a API local ou proxy configurado
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, top_k: 5 })
                });

                if (!response.ok) throw new Error('Erro na API');
                
                const data = await response.json();
                
                if (data && data.answer) {
                    addMessage(data.answer, false);
                } else {
                    addMessage("Não foi possível gerar uma resposta no momento.", false);
                }
                
            } catch (error) {
                addMessage("Houve um erro de conexão. Verifique se o backend está rodando.", false);
            } finally {
                submitBtn.disabled = false;
                typingIndicator.style.display = 'none';
                scrollToBottom();
            }
        });
    </script>
</body>
</html>
