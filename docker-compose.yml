version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: knowledge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: knowledge_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    container_name: knowledge_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Roda as migrações e encerra o container
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    container_name: knowledge_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["uvicorn", "core.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # Worker (opcional, pode ser ativado quando o job scheduler real for configurado)
  # worker:
  #   build: .
  #   container_name: knowledge_worker
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     migrate:
  #       condition: service_completed_successfully
  #   env_file:
  #     - .env
  #   command: ["python", "-m", "worker.ingestion"]
  #   restart: unless-stopped

volumes:
  pgdata:
